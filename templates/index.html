<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>BasketOracle – Value Hunting</title>
<style>
  :root{
    --bg:#0d1117;--card:#161b22;--card2:#1c2330;--border:#30363d;
    --text:#e6edf3;--muted:#8b949e;--accent:#f78166;
    --green:#3fb950;--red:#f85149;--blue:#58a6ff;--orange:#f0883e;
    --yellow:#e3b341;--purple:#d2a8ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}

  header{
    background:var(--card);border-bottom:1px solid var(--border);
    padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100
  }
  .logo{font-size:1.2rem;font-weight:800;color:var(--orange);letter-spacing:1px}
  .badge{background:#f0883e22;color:var(--orange);font-size:.65rem;font-weight:700;
         padding:3px 8px;border-radius:20px;border:1px solid var(--orange)}
  .report-btn-header{
    margin-left:auto;background:var(--card2);color:var(--purple);
    border:1px solid var(--purple);padding:5px 11px;border-radius:6px;
    font-size:.7rem;font-weight:700;cursor:pointer
  }

  /* ── DATE TABS (football style) ── */
  .date-tabs-wrap{
    background:var(--card);border-bottom:1px solid var(--border);
    padding:10px 10px 8px;
  }
  .date-tabs{
    display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
    padding-bottom:2px;
  }
  .date-tabs::-webkit-scrollbar{display:none}
  .date-tab{
    flex:0 0 auto;display:flex;flex-direction:column;align-items:center;
    padding:7px 13px;border-radius:20px;border:1.5px solid transparent;
    background:var(--card2);cursor:pointer;transition:all .15s;
    font-family:inherit;color:var(--muted);min-width:58px;
  }
  .date-tab:hover{border-color:#f0883e44;color:var(--text)}
  .date-tab.active{
    background:linear-gradient(135deg,#f0883e,#e05a1e);
    border-color:transparent;color:#fff;
    box-shadow:0 3px 14px #f0883e44;
  }
  .date-tab .dt-date{font-size:.75rem;font-weight:700;line-height:1.2}
  .date-tab .dt-day {font-size:.62rem;font-weight:600;line-height:1.2;opacity:.75}
  .date-tab.active .dt-day{opacity:.85}
  .date-tab.is-today .dt-date{color:var(--orange)}
  .date-tab.active.is-today .dt-date{color:#fff}
  .today-pip{width:4px;height:4px;border-radius:50%;background:var(--orange);margin-top:3px}
  .date-tab.active .today-pip{background:#fff}
  #status-bar{font-size:.72rem;color:var(--muted);text-align:right;padding:2px 4px 0}

  .time-group{margin:8px 10px 0}
  .time-header{display:flex;align-items:center;gap:7px;padding:5px 0;font-size:.83rem;font-weight:700;color:var(--orange)}
  .time-header .cnt{background:var(--orange);color:#fff;border-radius:50%;width:17px;height:17px;
                    font-size:.62rem;display:flex;align-items:center;justify-content:center}

  .match-card{
    background:var(--card);border:1px solid var(--border);border-radius:9px;
    margin-bottom:7px;overflow:hidden;transition:border-color .15s
  }
  .match-card:hover{border-color:#58a6ff44}
  .match-card.live{border-color:#f8514944}
  .match-card.expanded .analysis-panel{display:block}
  .match-card.expanded .expand-btn{transform:rotate(180deg)}

  .match-header{display:flex;align-items:center;padding:9px 11px;gap:6px;cursor:pointer}
  .time-col{min-width:42px;font-size:.75rem;font-weight:700;color:var(--muted);text-align:center;flex-shrink:0}
  .live-dot{color:var(--red);font-size:.9rem;animation:blink 1s infinite}
  .live-text{font-size:.6rem;color:var(--red);font-weight:700}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

  .league-col{font-size:.6rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:80px;flex-shrink:0}
  .teams-col{flex:1;min-width:0;overflow:hidden}
  .team-name{font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .team-name.away{color:var(--muted);margin-top:2px}

  .score-col{text-align:center;min-width:62px;flex-shrink:0}
  .score-main{font-size:1rem;font-weight:800;color:var(--accent)}
  .score-main.live{color:var(--red)}
  .score-ht{font-size:.6rem;color:var(--muted)}

  .odds-col{min-width:60px;max-width:70px;flex-shrink:0;text-align:right}
  .odds-small{display:flex;gap:3px;justify-content:flex-end;flex-wrap:wrap}
  .odd-pill{
    background:var(--card2);border:1px solid var(--border);border-radius:4px;
    font-size:.62rem;font-weight:700;padding:2px 4px;color:var(--text)
  }
  .odd-pill.home{color:var(--green)}
  .odd-pill.away{color:var(--red)}

  .expand-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.85rem;padding:4px;transition:transform .2s;flex-shrink:0}

  .analysis-panel{display:none;border-top:1px solid var(--border);padding:12px 11px}
  .analysis-loading{text-align:center;color:var(--muted);font-size:.78rem;padding:18px 0}

  .stat-row{display:flex;gap:7px;margin-bottom:9px}
  .stat-box{flex:1;background:var(--card2);border-radius:7px;padding:9px 6px;text-align:center;border:1px solid var(--border)}
  .stat-box .val{font-size:1.05rem;font-weight:800;color:var(--yellow)}
  .stat-box .lbl{font-size:.58rem;color:var(--muted);margin-top:2px}

  .section-title{font-size:.68rem;color:var(--muted);font-weight:700;text-transform:uppercase;
                 letter-spacing:.5px;margin-bottom:5px;display:flex;align-items:center;gap:4px}
  .section-title::before{content:'●';font-size:.52rem}

  .result-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px}
  .result-btn{border-radius:7px;padding:9px 5px;text-align:center;border:2px solid var(--border)}
  .result-btn.active{border-color:var(--orange);background:#f0883e0d}
  .result-btn .r-lbl{font-size:.62rem;color:var(--muted)}
  .result-btn .r-fair{font-size:.72rem;color:var(--muted);margin-top:1px}
  .result-btn .r-market{font-size:1.1rem;font-weight:800;color:var(--orange)}
  .result-btn .r-pct{font-size:.68rem;color:var(--muted);margin-top:1px}

  .value-badge{
    display:inline-block;font-size:.6rem;font-weight:700;padding:1px 5px;
    border-radius:10px;margin-top:2px
  }
  .value-badge.pos{background:#3fb95033;color:var(--green);border:1px solid var(--green)}
  .value-badge.neg{background:#f8514922;color:var(--red);border:1px solid var(--red)}

  .impl-row{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--card2);border-radius:6px;padding:6px 8px;
    margin-bottom:9px;font-size:.68rem
  }
  .impl-item{text-align:center}
  .impl-item .il{color:var(--muted);font-size:.58rem}
  .impl-item .iv{font-weight:700}
  .impl-item .iv.our{color:var(--blue)}
  .impl-item .iv.mkt{color:var(--yellow)}

  .hcap-section{margin-bottom:9px}
  .hcap-row{display:flex;align-items:center;gap:5px;margin-bottom:3px}
  .hcap-line{min-width:38px;font-size:.72rem;color:var(--text);font-weight:600}
  .hcap-bar{flex:1;height:17px;border-radius:4px;display:flex;overflow:hidden}
  .hcap-home{background:#3fb95066;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;color:#fff}
  .hcap-away{background:#f8514966;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;color:#fff}

  .ou-section{margin-bottom:9px}
  .ou-legend{display:flex;gap:8px;font-size:.58rem;color:var(--muted);margin-bottom:3px}
  .ou-legend .ust{color:var(--green)} .ou-legend .alt{color:var(--red)}
  .ou-row{display:flex;align-items:center;gap:5px;margin-bottom:3px;position:relative}
  .ou-line{min-width:44px;font-size:.72rem;color:var(--text);font-weight:600}
  .ou-bar{flex:1;height:20px;border-radius:4px;display:flex;overflow:hidden}
  .ou-over {background:#3fb95066;display:flex;align-items:center;justify-content:center;font-size:.63rem;font-weight:700;color:#fff}
  .ou-under{background:#f8514966;display:flex;align-items:center;justify-content:center;font-size:.63rem;font-weight:700;color:#fff}
  .ou-odds{font-size:.6rem;color:var(--muted);min-width:50px;text-align:right}
  .ou-val{font-size:.58rem;font-weight:700;min-width:34px;text-align:right}
  .ou-val.pos{color:var(--green)} .ou-val.neg{color:var(--red)} .ou-val.none{color:var(--muted)}

  /* ── OU Karşılaştırma Satırı ── */
  .ou-compare{
    display:flex;align-items:center;gap:3px;font-size:.58rem;flex-shrink:0;
  }
  .ou-cmp-item{text-align:center;min-width:30px}
  .ou-cmp-item .cmp-lbl{color:var(--muted);font-size:.52rem;line-height:1}
  .ou-cmp-item .cmp-val{font-weight:700;line-height:1.3}
  .cmp-val.our{color:var(--blue)}
  .cmp-val.mkt{color:var(--yellow)}
  .ou-cmp-sep{color:var(--border);font-size:.6rem}
  .ou-val-badge{font-size:.58rem;font-weight:700;min-width:32px;text-align:center;
    padding:1px 3px;border-radius:4px;flex-shrink:0}
  .ou-val-badge.pos{background:#3fb95022;color:var(--green);border:1px solid #3fb95055}
  .ou-val-badge.neg{background:#f8514922;color:var(--red);border:1px solid #f8514955}
  .ou-val-badge.none{color:var(--muted)}

  .value-alert{
    background:#3fb95015;border:1px solid var(--green);border-radius:7px;
    padding:8px 10px;margin-bottom:9px;font-size:.72rem
  }
  .value-alert .va-title{color:var(--green);font-weight:700;margin-bottom:4px}
  .value-alert .va-item{color:var(--text);margin-top:2px}

  .rating-row{display:flex;gap:7px;margin-bottom:9px}
  .rating-box{flex:1;background:var(--card2);border-radius:7px;padding:7px;text-align:center;border:1px solid var(--border)}
  .rating-box .r-lbl{font-size:.58rem;color:var(--muted)}
  .rating-box .r-val{font-size:.9rem;font-weight:800}
  .r-val.pos{color:var(--green)} .r-val.neg{color:var(--red)} .r-val.neu{color:var(--muted)}

  .data-info{font-size:.58rem;color:var(--muted);text-align:right;margin-top:5px}

  /* Filtre butonları */
  .filter-bar{display:flex;gap:8px;padding:8px 12px;background:var(--bg)}
  .filter-btn{
    flex:1;padding:7px 4px;border-radius:8px;border:1px solid var(--border);
    background:var(--card);color:var(--muted);font-size:.7rem;font-weight:700;
    cursor:pointer;transition:all .2s;
  }
  .filter-btn.active{background:var(--orange);color:#fff;border-color:var(--orange)}
  .filter-btn#btn-conf.active{background:#3fb950;border-color:#3fb950}
  .filter-btn#btn-gap.active{background:#e3b341;color:#000;border-color:#e3b341}
  .filter-btn#btn-iy.active{background:#a371f7;border-color:#a371f7}

  /* Arama */
  .search-bar{padding:0 12px 8px;background:var(--bg)}
  .search-bar input{
    width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--border);
    background:var(--card);color:var(--text);font-size:.75rem;box-sizing:border-box;
  }
  .search-bar input::placeholder{color:var(--muted)}

  /* Güven rozeti — kart başlığında */
  .conf-badge{
    font-size:.55rem;font-weight:700;padding:2px 5px;border-radius:8px;
    white-space:nowrap;flex-shrink:0
  }
  .conf-wait{background:var(--card2);color:var(--muted);border:1px solid var(--border)}
  .conf-high{background:#3fb95022;color:var(--green);border:1px solid var(--green)}
  .conf-mid {background:#e3b34122;color:var(--yellow);border:1px solid var(--yellow)}
  .conf-low {background:#f8514922;color:var(--red);border:1px solid var(--red)}

  /* ── SİSTEM TAHMİNİ ── */
  .sys-pred-box{
    background:linear-gradient(135deg,#1c2330,#0d1117);
    border:1px solid #58a6ff44;border-radius:9px;
    padding:10px 11px;margin-bottom:9px
  }
  .sys-pred-title{
    font-size:.65rem;font-weight:800;color:var(--blue);
    text-transform:uppercase;letter-spacing:.8px;
    margin-bottom:8px;display:flex;align-items:center;gap:5px
  }
  .sys-pred-title::before{content:'🤖'}
  .sys-score-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .sys-team-score{text-align:center;flex:1}
  .sys-team-score .sts-val{font-size:1.3rem;font-weight:900;color:var(--blue)}
  .sys-team-score .sts-lbl{font-size:.55rem;color:var(--muted);margin-top:1px}
  .sys-vs{font-size:.7rem;color:var(--border);padding:0 4px;font-weight:700}
  .sys-detail-row{display:flex;gap:5px;margin-bottom:6px}
  .sys-detail-box{flex:1;background:#ffffff08;border-radius:5px;padding:5px 4px;text-align:center}
  .sys-detail-box .sd-val{font-size:.85rem;font-weight:800;color:var(--purple)}
  .sys-detail-box .sd-lbl{font-size:.5rem;color:var(--muted);margin-top:1px}
  .sys-bottom-row{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
  .sys-result-pill{
    font-size:.62rem;font-weight:700;padding:3px 9px;border-radius:12px;
    display:inline-flex;align-items:center;gap:3px
  }
  .sys-result-pill.home{background:#3fb95022;color:var(--green);border:1px solid var(--green)}
  .sys-result-pill.away{background:#f8514922;color:var(--red);border:1px solid var(--red)}
  .sys-hcap-pill{
    font-size:.62rem;font-weight:700;padding:3px 9px;border-radius:12px;
    background:#58a6ff22;color:var(--blue);border:1px solid #58a6ff55;
    display:inline-flex;align-items:center;gap:3px
  }
  .sys-conf-pill{
    font-size:.6rem;font-weight:700;padding:3px 8px;border-radius:12px;
    background:#e3b34122;color:var(--yellow);border:1px solid #e3b34155;
    margin-left:auto
  }

  /* ── RAPOR MODAL ── */
  .modal-overlay{
    display:none;position:fixed;inset:0;background:#000a;z-index:200;
    align-items:flex-end;justify-content:center
  }
  .modal-overlay.open{display:flex}
  .modal-sheet{
    background:var(--card);border-radius:16px 16px 0 0;width:100%;max-height:88vh;
    overflow-y:auto;padding:18px 16px 32px
  }
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .modal-title{font-size:1rem;font-weight:800;color:var(--orange)}
  .modal-close{background:none;border:none;color:var(--muted);font-size:1.3rem;cursor:pointer}

  .report-date-row{display:flex;gap:8px;margin-bottom:12px;align-items:center}
  .report-date-row input[type=date]{
    background:var(--card2);border:1px solid var(--border);color:var(--text);
    padding:6px 10px;border-radius:6px;font-size:.85rem;flex:1
  }
  .report-date-row button{
    background:var(--orange);color:#fff;border:none;padding:7px 14px;
    border-radius:6px;font-size:.85rem;cursor:pointer;font-weight:700
  }

  .report-section{background:var(--card2);border-radius:9px;padding:12px;margin-bottom:10px;border:1px solid var(--border)}
  .report-section-title{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;display:flex;align-items:center;gap:5px}
  .report-kv{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #ffffff08;font-size:.8rem}
  .report-kv:last-child{border-bottom:none}
  .report-kv .rk{color:var(--muted)}
  .report-kv .rv{font-weight:700}
  .rv.good{color:var(--green)} .rv.bad{color:var(--red)} .rv.mid{color:var(--yellow)}

  .match-report-card{
    background:var(--card2);border-radius:8px;padding:10px;margin-bottom:8px;
    border:1px solid var(--border);font-size:.75rem
  }
  .match-report-card .mr-teams{font-weight:700;color:var(--text);margin-bottom:4px}
  .match-report-card .mr-score{color:var(--orange);font-size:.85rem;font-weight:800}
  .match-report-card .mr-pred{color:var(--muted);font-size:.68rem;margin-top:3px}
  .match-report-card .mr-result{margin-top:4px;display:flex;gap:5px;flex-wrap:wrap}
  .chip{display:inline-block;padding:2px 7px;border-radius:10px;font-size:.62rem;font-weight:700}
  .chip.win{background:#3fb95033;color:var(--green);border:1px solid var(--green)}
  .chip.loss{background:#f8514922;color:var(--red);border:1px solid var(--red)}
  .chip.wait{background:#e3b34122;color:var(--yellow);border:1px solid var(--yellow)}

  .json-btn{
    width:100%;margin-top:12px;background:var(--purple);color:#fff;
    border:none;padding:12px;border-radius:8px;font-size:.9rem;
    font-weight:700;cursor:pointer;letter-spacing:.5px
  }
  .report-empty{text-align:center;color:var(--muted);font-size:.8rem;padding:24px 0}

  /* ── BET365 BAREMİ ── */
  .b365-box{
    background:#0d1f3c;border:1px solid #1a4080;border-radius:8px;
    padding:9px 11px;margin-top:8px;
  }
  .b365-title{font-size:.65rem;font-weight:800;color:#58a6ff;
    text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;
    display:flex;align-items:center;gap:4px}
  .b365-row{display:flex;justify-content:space-between;align-items:center;
    padding:3px 0;border-bottom:1px solid #1a4080;font-size:.72rem}
  .b365-row:last-child{border-bottom:none}
  .b365-lbl{color:#8b949e;font-weight:600;min-width:48px}
  .b365-val{color:#e6edf3;font-weight:700;text-align:right}
</style>
</head>
<body>

<header>
  <div class="logo">🏀 BASKETORACLE</div>
  <div class="badge">VALUE HUNTING</div>
  <button class="report-btn-header" onclick="openReport()">📊 Rapor</button>
</header>

<div class="date-tabs-wrap">
  <div class="date-tabs" id="dateTabs"></div>
  <span id="status-bar"></span>
</div>

<!-- FİLTRE BUTONLARI -->
<div class="filter-bar">
  <button class="filter-btn" id="btn-all"    onclick="setFilter('all')">📋 Tümü</button>
  <button class="filter-btn" id="btn-conf"   onclick="setFilter('conf')">🔥 %70+</button>
  <button class="filter-btn" id="btn-gap"    onclick="setFilter('gap')">🎯 GAP</button>
  <button class="filter-btn" id="btn-iy"     onclick="setFilter('iy')">⏱ İY</button>
</div>
<div class="search-bar">
  <input type="text" id="searchInput" placeholder="🔍 Lig veya takım ara... (NBA, EuroLeague...)" oninput="applySearch()"/>
</div>

<!-- hidden input keeps compatibility with existing JS -->
<input type="date" id="dateInput" style="display:none"/>

<div id="matches-container"></div>

<!-- RAPOR MODAL -->
<div class="modal-overlay" id="reportModal" onclick="closeReportOutside(event)">
  <div class="modal-sheet">
    <div class="modal-header">
      <div class="modal-title">📊 Günlük Rapor</div>
      <button class="modal-close" onclick="closeReport()">✕</button>
    </div>

    <div class="report-date-row">
      <input type="date" id="reportDateInput"/>
      <button onclick="loadReport()">Yükle</button>
    </div>

    <div id="report-content">
      <div class="report-empty">Tarih seçip Yükle'ye bas</div>
    </div>

    <button class="json-btn" onclick="downloadReportJSON()">⬇️ JSON İndir</button>
  </div>
</div>

<script>
function todayLocal(){
  // UTC+3 Türkiye saati (yaz/kış değişmez)
  const utcMs = Date.now() + 3 * 3600 * 1000;
  return new Date(utcMs).toISOString().slice(0,10);
}
function pct(v){ return Math.round(v)+'%'; }
function fmtVal(v){
  if(v===null||v===undefined) return '';
  return (v>=0?'+':'')+v+'%';
}

// ─── Rapor verisi (JSON indirmek için saklanır) ───────────────────
let _reportData = null;

// ─── Rapor Modal ────────────────────────────────────────────────
function openReport(){
  document.getElementById('reportDateInput').value = document.getElementById('dateInput').value || todayLocal();
  document.getElementById('reportModal').classList.add('open');
  loadReport();
}
function closeReport(){
  document.getElementById('reportModal').classList.remove('open');
}
function closeReportOutside(e){
  if(e.target === document.getElementById('reportModal')) closeReport();
}

async function loadReport(){
  const date = document.getElementById('reportDateInput').value;
  if(!date) return;

  document.getElementById('report-content').innerHTML =
    '<div class="report-empty">Yükleniyor…</div>';

  try{
    const r = await fetch(`/api/fixtures?date=${date}`);
    const d = await r.json();
    if(!d.success || !d.matches.length){
      document.getElementById('report-content').innerHTML =
        '<div class="report-empty">Bu tarihte maç bulunamadı.</div>';
      return;
    }
    renderReport(d.matches, date);
  }catch(e){
    document.getElementById('report-content').innerHTML =
      '<div class="report-empty">Hata oluştu.</div>';
    console.error(e);
  }
}

function renderReport(matches, date){
  // Tahmin istatistikleri
  let total=0, finished=0;
  let ms_total=0, ms_correct=0;
  let ou_total=0, ou_model_under_correct=0, ou_model_over_correct=0;
  let iy_total=0, iy_model_correct=0;
  // SofaScore gap sinyali başarısı
  let gap_total=0, gap_correct=0;
  // IY gap sinyali
  let iy_gap_total=0, iy_gap_correct=0;

  const matchCards = [];
  const reportMatches = [];

  matches.forEach(m=>{
    total++;
    const isFinished = m.status === 'finished';
    if(isFinished) finished++;

    // Analiz verisi (cache'den veya _matchStore'dan)
    const analysis = _analysisStore[m.match_id];

    // Gerçek skorlar
    const realTotal = (m.home_score != null && m.away_score != null)
      ? m.home_score + m.away_score : null;
    const realHtTotal = (m.home_ht_score != null && m.away_ht_score != null)
      ? m.home_ht_score + m.away_ht_score : null;
    const realWinner = (m.home_score != null && m.away_score != null)
      ? (m.home_score > m.away_score ? '1' : '2') : null;

    // Tahmin
    const pred = analysis ? analysis.prediction : null;
    const expTotal = analysis ? analysis.exp_total : null;
    const expIyTotal = analysis ? analysis.exp_iy_total : null;

    // Başarı kontrolleri
    let msResult = null, ouResult = null, iyResult = null;

    if(isFinished && pred && realWinner){
      ms_total++;
      if(pred === realWinner){ ms_correct++; msResult='win'; }
      else msResult='loss';
    } else if(pred) msResult='wait';

    // Model toplam tahmini vs gerçek skor
    // Bahisçi line'ları varsa onlara göre de göster
    const marketOuLines = m.ou_lines_market || [];

    if(isFinished && expTotal != null && realTotal != null){
      ou_total++;
      const ouDiff = Math.abs(expTotal - realTotal);
      if(ouDiff <= 7.5){ ouResult='win'; ou_model_under_correct++; }
      else { ouResult='loss'; ou_model_over_correct++; }

      // Model vs Piyasa karşılaştırması
      // Piyasa baremi SofaScore'dan geliyor (ou_lines[0])
      const ouLines = analysis ? (analysis.ou_lines || []) : [];
      if(ouLines.length > 0 && ouLines[0].line != null){
        const mktLine = ouLines[0].line;
        const modelVsMkt = expTotal - mktLine; // + ise model ÜST, - ise model ALT
        if(Math.abs(modelVsMkt) >= 4){ // en az 4 puan fark varsa sinyal ver
          gap_total++;
          // Model ÜST diyorsa (expTotal > mktLine) → gerçek > mktLine olmalı
          // Model ALT diyorsa (expTotal < mktLine) → gerçek < mktLine olmalı
          const gapCorrect = modelVsMkt > 0
            ? (realTotal > mktLine)   // Model ÜST dedi
            : (realTotal < mktLine);  // Model ALT dedi
          if(gapCorrect) gap_correct++;
        }
      }
    } else if(expTotal != null) ouResult='wait';

    if(isFinished && expIyTotal != null && realHtTotal != null){
      iy_total++;
      const iyDiff = Math.abs(expIyTotal - realHtTotal);
      iyResult = iyDiff <= 5 ? 'win' : 'loss';
      if(iyResult==='win') iy_model_correct++;

      // IY Model vs Piyasa
      const iyLines = analysis ? (analysis.iy_ou_lines || []) : [];
      if(iyLines.length > 0 && iyLines[0].line != null){
        const iyMktLine = iyLines[0].line;
        const iyVsMkt = expIyTotal - iyMktLine;
        if(Math.abs(iyVsMkt) >= 2){
          iy_gap_total++;
          const iyCorrect = iyVsMkt > 0
            ? (realHtTotal > iyMktLine)
            : (realHtTotal < iyMktLine);
          if(iyCorrect) iy_gap_correct++;
        }
      }
    } else if(expIyTotal != null) iyResult='wait';

    // Bahisçi line'larına göre ALT sonucu
    const marketLines = marketOuLines.map(l=>{
      if(!isFinished || realTotal===null) return {line:l.line, result:'wait'};
      return {line:l.line, result: realTotal < l.line ? 'win':'loss'};
    });

    const scoreStr = (m.home_score!=null&&m.away_score!=null)
      ? `${m.home_score}-${m.away_score}` : '?-?';
    const htStr = (m.home_ht_score!=null&&m.away_ht_score!=null)
      ? `IY: ${m.home_ht_score}-${m.away_ht_score}` : '';

    // Chip'ler
    const chipHtml = (result, label) => {
      if(!result) return '';
      const cls = result==='win'?'win':result==='loss'?'loss':'wait';
      const icon = result==='win'?'✓':result==='loss'?'✗':'⏳';
      return `<span class="chip ${cls}">${icon} ${label}</span>`;
    };

    const marketLineChips = marketLines.map(l=>
      chipHtml(l.result, `${l.line} ALT`)
    ).join('');

    matchCards.push(`
      <div class="match-report-card">
        <div class="mr-teams">${m.home_team} vs ${m.away_team}</div>
        <div style="font-size:.6rem;color:var(--muted)">${m.league} · ${m.time}</div>
        <div class="mr-score">${scoreStr} ${htStr}</div>
        ${analysis ? `<div class="mr-pred">
          Model: MS→<b>${pred}</b> · Toplam→<b>${expTotal}</b> · İY→<b>${expIyTotal}</b>
        </div>` : '<div class="mr-pred" style="color:var(--muted)">Analiz açılmadı</div>'}
        <div class="mr-result">
          ${chipHtml(msResult, 'MS '+pred)}
          ${expTotal!=null?chipHtml(ouResult, 'MS Toplam'):''}
          ${expIyTotal!=null?chipHtml(iyResult, 'İY Toplam'):''}
          ${marketLineChips}
        </div>
      </div>
    `);

    // IY Model vs Piyasa gap
    const iyLines2 = analysis ? (analysis.iy_ou_lines || []) : [];
    const iyMktLine = iyLines2.length > 0 ? iyLines2[0].line : null;
    const iyVsMkt2 = (expIyTotal != null && iyMktLine != null) ? expIyTotal - iyMktLine : null;
    const hasIyGap = iyVsMkt2 != null && Math.abs(iyVsMkt2) >= 2;
    const iyGapDir = hasIyGap ? (iyVsMkt2 > 0 ? 'ust' : 'alt') : null;
    const iyGapResult = (hasIyGap && isFinished && realHtTotal != null)
      ? (iyGapDir==='ust' ? (realHtTotal > iyMktLine ? 'win':'loss') : (realHtTotal < iyMktLine ? 'win':'loss'))
      : (hasIyGap ? 'wait' : null);
    const ouLines = analysis ? (analysis.ou_lines || []) : [];
    const mktLine = ouLines.length > 0 ? ouLines[0].line : null;
    const modelVsMkt = (expTotal != null && mktLine != null) ? expTotal - mktLine : null;
    const hasGap  = modelVsMkt != null && Math.abs(modelVsMkt) >= 4;
    const gapLine = hasGap ? mktLine : null;
    const gapDir  = hasGap ? (modelVsMkt > 0 ? 'ust' : 'alt') : null;
    const gapResult = (hasGap && isFinished && realTotal != null)
      ? (gapDir==='ust' ? (realTotal > mktLine ? 'win':'loss') : (realTotal < mktLine ? 'win':'loss'))
      : (hasGap ? 'wait' : null);

    reportMatches.push({
      match_id: m.match_id,
      home_team: m.home_team,
      away_team: m.away_team,
      league: m.league,
      time: m.time,
      date: date,
      status: m.status,
      real_score: scoreStr,
      real_total: realTotal,
      real_ht_total: realHtTotal,
      real_winner: realWinner,
      prediction: pred,
      exp_total: expTotal,
      exp_iy_total: expIyTotal,
      ms_result: msResult,
      ou_result: ouResult,
      iy_result: iyResult,
      gap_line: gapLine,
      gap_dir: gapDir,
      gap_result: gapResult,
      gap_model: expTotal,
      gap_size: hasGap ? Math.round(Math.abs(modelVsMkt)*10)/10 : null,
      iy_gap_line: hasIyGap ? iyMktLine : null,
      iy_gap_dir: iyGapDir,
      iy_gap_result: iyGapResult,
      // MS oranları (SofaScore'dan)
      odd_home: analysis ? analysis.market_odd_home : null,
      odd_away: analysis ? analysis.market_odd_away : null,
      // OU oranları
      ou_odd_over:  mktLine && ouLines[0] ? ouLines[0].odd_over  : null,
      ou_odd_under: mktLine && ouLines[0] ? ouLines[0].odd_under : null,
      market_ou_lines: marketLines,
      rating_g: analysis ? analysis.g_rating : null,
      rating_id: analysis ? analysis.id_rating : null,
      confidence: analysis ? analysis.confidence : null,
    });
  });

  // Özet
  const msPct = ms_total > 0 ? Math.round(ms_correct/ms_total*100) : null;
  const ouPct = ou_total > 0 ? Math.round(ou_model_under_correct/ou_total*100) : null;
  const iyPct = iy_total > 0 ? Math.round(iy_model_correct/iy_total*100) : null;

  // %70+ güven MS başarısı
  const conf70 = reportMatches.filter(m => m.confidence >= 70 && m.ms_result !== null);
  const conf70_w = conf70.filter(m => m.ms_result === 'win').length;
  const conf70_total = conf70.filter(m => ['win','loss'].includes(m.ms_result)).length;
  const conf70Pct = conf70_total > 0 ? Math.round(conf70_w/conf70_total*100) : null;

  // GAP başarısı (gap_result)
  const gapFinished = reportMatches.filter(m => m.gap_result === 'win' || m.gap_result === 'loss');
  const gapWin = gapFinished.filter(m => m.gap_result === 'win').length;
  const gapPct = gapFinished.length > 0 ? Math.round(gapWin/gapFinished.length*100) : null;

  // GAP ÜST (sadece model ÜST dedikleri)
  const gapUst = reportMatches.filter(m => m.gap_dir === 'ust' && ['win','loss'].includes(m.gap_result));
  const gapUstWin = gapUst.filter(m => m.gap_result === 'win').length;
  const gapUstPct = gapUst.length > 0 ? Math.round(gapUstWin/gapUst.length*100) : null;

  const pctColor = v => v===null?'mid':v>=60?'good':v>=45?'mid':'bad';

  const summaryHtml = `
    <div class="report-section">
      <div class="report-section-title">📅 Genel</div>
      <div class="report-kv"><span class="rk">Tarih</span><span class="rv">${date}</span></div>
      <div class="report-kv"><span class="rk">Toplam maç</span><span class="rv">${total}</span></div>
      <div class="report-kv"><span class="rk">Biten maç</span><span class="rv">${finished}</span></div>
      <div class="report-kv"><span class="rk">Devam eden</span><span class="rv">${total-finished}</span></div>
    </div>
    <div class="report-section">
      <div class="report-section-title">🎯 MS Tahmin Başarısı</div>
      <div class="report-kv"><span class="rk">Doğru tahmin</span><span class="rv">${ms_correct} / ${ms_total}</span></div>
      <div class="report-kv"><span class="rk">Başarı oranı</span><span class="rv ${pctColor(msPct)}">${msPct!==null?msPct+'%':'–%'}</span></div>
    </div>
    <div class="report-section">
      <div class="report-section-title">🔥 %70+ Güven MS Başarısı</div>
      <div class="report-kv"><span class="rk">Maç sayısı</span><span class="rv">${conf70_total}</span></div>
      <div class="report-kv"><span class="rk">Doğru tahmin</span><span class="rv">${conf70_w} / ${conf70_total}</span></div>
      <div class="report-kv"><span class="rk">Başarı oranı</span><span class="rv ${pctColor(conf70Pct)}">${conf70Pct!==null?conf70Pct+'%':'–%'}</span></div>
    </div>
    <div class="report-section">
      <div class="report-section-title">🎯 GAP Sinyali Başarısı (ÜST)</div>
      <div class="report-kv"><span class="rk">Sinyal verilen</span><span class="rv">${gapUst.length}</span></div>
      <div class="report-kv"><span class="rk">Doğru</span><span class="rv">${gapUstWin} / ${gapUst.length}</span></div>
      <div class="report-kv"><span class="rk">Başarı oranı</span><span class="rv ${pctColor(gapUstPct)}">${gapUstPct!==null?gapUstPct+'%':'–%'}</span></div>
    </div>
    <div class="report-section">
      <div class="report-section-title">📊 Model MS Toplam Başarısı (±7.5 puan)</div>
      <div class="report-kv"><span class="rk">Toplam analiz</span><span class="rv">${ou_total}</span></div>
      <div class="report-kv"><span class="rk">İsabetli (±7.5)</span><span class="rv">${ou_model_under_correct} / ${ou_total}</span></div>
      <div class="report-kv"><span class="rk">Başarı oranı</span><span class="rv ${pctColor(ouPct)}">${ouPct!==null?ouPct+'%':'–%'}</span></div>
    </div>
    <div class="report-section">
      <div class="report-section-title">🎯 Model vs Piyasa OU Sinyali (≥4 puan fark)</div>
      <div class="report-kv"><span class="rk">Sinyal verilen</span><span class="rv">${gap_total}</span></div>
      <div class="report-kv"><span class="rk">Model doğru</span><span class="rv">${gap_correct} / ${gap_total}</span></div>
      <div class="report-kv"><span class="rk">Başarı oranı</span><span class="rv ${pctColor(gap_total>0?Math.round(gap_correct/gap_total*100):null)}">${gap_total>0?Math.round(gap_correct/gap_total*100)+'%':'–%'}</span></div>
    </div>
    <div class="report-section">
      <div class="report-section-title">⏱ Model vs Piyasa İY Sinyali (≥2 puan fark)</div>
      <div class="report-kv"><span class="rk">Sinyal verilen</span><span class="rv">${iy_gap_total}</span></div>
      <div class="report-kv"><span class="rk">Model doğru</span><span class="rv">${iy_gap_correct} / ${iy_gap_total}</span></div>
      <div class="report-kv"><span class="rk">Başarı oranı</span><span class="rv ${pctColor(iy_gap_total>0?Math.round(iy_gap_correct/iy_gap_total*100):null)}">${iy_gap_total>0?Math.round(iy_gap_correct/iy_gap_total*100)+'%':'–%'}</span></div>
    </div>
    <div class="report-section">
      <div class="report-section-title">⏱ Model İY Toplam Başarısı (±5 puan)</div>
      <div class="report-kv"><span class="rk">Toplam analiz</span><span class="rv">${iy_total}</span></div>
      <div class="report-kv"><span class="rk">İsabetli (±5)</span><span class="rv">${iy_model_correct} / ${iy_total}</span></div>
      <div class="report-kv"><span class="rk">Başarı oranı</span><span class="rv ${pctColor(iyPct)}">${iyPct!==null?iyPct+'%':'–%'}</span></div>
    </div>
  `;

  const analysisNote = Object.keys(_analysisStore).length === 0
    ? '<div class="report-empty" style="font-size:.7rem;margin-bottom:8px">⚠️ Maçları açmadıysan analiz verisi yok — sonuçlar kısmi görünür</div>' : '';

  document.getElementById('report-content').innerHTML =
    summaryHtml + analysisNote + matchCards.join('');

  _reportData = { date, summary: { total, finished, ms_correct, ms_total, msPct, ouPct, iyPct }, matches: reportMatches };
}

async function loadFixtures(){
  const date=document.getElementById('dateInput').value;
  document.getElementById('status-bar').textContent='Yükleniyor…';
  document.getElementById('matches-container').innerHTML='';
  try{
    const r=await fetch(`/api/fixtures?date=${date}`);
    if(!r.ok){ throw new Error('HTTP '+r.status); }
    const d=await r.json();
    const matches = (d.matches && d.matches.length) ? d.matches : (Array.isArray(d) ? d : []);
    if(!matches.length){
      document.getElementById('matches-container').innerHTML=
        '<p style="text-align:center;color:#8b949e;padding:40px">Maç bulunamadı.</p>';
      document.getElementById('status-bar').textContent='0 maç';
      return;
    }
    renderMatches(matches);
    document.getElementById('status-bar').textContent=`${matches.length} maç`;
  }catch(e){
    document.getElementById('status-bar').textContent='Hata! ('+e.message+')';
    console.error(e);
  }
}

const _matchStore    = {};
const _analysisStore = {};  // match_id → analysis
const _loaded        = {};  // analiz tamamlananlar

// ─── Analiz isteği ────────────────────────────────────────────
// ─── SofaScore event cache (günlük) ──────────────────────────
const _sofaEventCache = {};  // date → events array

async function _loadSofaEvents(date){
  if(_sofaEventCache[date]) return _sofaEventCache[date];
  try{
    const url = `https://api.sofascore.com/api/v1/sport/basketball/scheduled-events/${date}`;
    const r = await fetch(url, { headers:{"Accept":"application/json"} });
    if(!r.ok) return [];
    const d = await r.json();
    const events = d.events || [];
    _sofaEventCache[date] = events;
    console.log(`[Sofa] ${date}: ${events.length} event yüklendi`);
    return events;
  }catch(e){
    console.warn('[Sofa] Event yüklenemedi:', e.message);
    return [];
  }
}
async function _fetchSofaOdds(m){
  try{
    const date = new Date(m.timestamp * 1000).toISOString().slice(0,10);
    // Cache'li event listesini kullan (günde 1 kez çekiliyor)
    const events = await _loadSofaEvents(date);
    if(!events.length) return null;

    // Takım ismine göre eşleştir — ters sıra da dene
    const hn = _normTeam(m.home_team||'');
    const an = _normTeam(m.away_team||'');
    let bestId = null, bestScore = 0;
    for(const ev of events){
      const eh = _normTeam(ev.homeTeam?.name||'');
      const ea = _normTeam(ev.awayTeam?.name||'');
      const score1 = (_sim(hn,eh) + _sim(an,ea)) / 2;
      const score2 = (_sim(hn,ea) + _sim(an,eh)) / 2;
      const score  = Math.max(score1, score2);
      if(score > bestScore){ bestScore = score; bestId = ev.id; }
    }
    if(!bestId || bestScore < 0.25){
      console.warn(`[Sofa] Eşleşme yok: "${m.home_team}" vs "${m.away_team}" (max: ${bestScore.toFixed(2)})`);
      return null;
    }
    console.log(`[Sofa] Eşleşti: "${m.home_team}" → skor=${bestScore.toFixed(2)} id=${bestId}`);

    // Oranları çek
    const odUrl = `https://api.sofascore.com/api/v1/event/${bestId}/odds/1/all`;
    const odRes = await fetch(odUrl, { headers: { "Accept": "application/json" } });
    if(!odRes.ok) return null;
    const odData = await odRes.json();

    // Parse et
    const result = {};
    for(const mkt of (odData.markets||[])){
      const name   = (mkt.marketName||'').toLowerCase();
      const group  = mkt.choiceGroup||'';
      const choices= mkt.choices||[];
      const line   = parseFloat(group) || null;

      if(name === 'game total' && line){
        result.ou_line = line;
        for(const c of choices){
          const odd = _fracToDecimal(c.fractionalValue);
          if(c.name==='Over')  result.ou_over  = odd;
          if(c.name==='Under') result.ou_under = odd;
        }
      }
      if((name.includes('1st half') || name.includes('first half')) && name.includes('total') && line){
        result.iy_line = line;
        for(const c of choices){
          const odd = _fracToDecimal(c.fractionalValue);
          if(c.name==='Over')  result.iy_over  = odd;
          if(c.name==='Under') result.iy_under = odd;
        }
      }
      if(name==='full time' && !result.ms_home){
        for(const c of choices){
          const odd = _fracToDecimal(c.fractionalValue);
          if(c.name==='1') result.ms_home = odd;
          if(c.name==='2') result.ms_away = odd;
        }
      }
    }
    console.log(`[Sofa] ${m.home_team} vs ${m.away_team}: ou=${result.ou_line} iy=${result.iy_line}`);
    return result;
  }catch(e){
    console.warn('[Sofa] hata:', e.message);
    return null;
  }
}

function _normTeam(name){
  const n = (name||'').toLowerCase().trim().replace(/\(.*?\)/g,'').trim();
  return TEAM_NAMES[n] || n;
}

function _sim(a, b){
  if(!a||!b) return 0;
  const la=_normTeam(a), lb=_normTeam(b);
  if(la===lb) return 1;
  if(la.includes(lb)||lb.includes(la)) return 0.9;
  const wa=la.split(/\s+/), wb=lb.split(/\s+/);
  let common=0;
  for(const w of wa){ if(w.length>2 && wb.some(x=>x===w||x.includes(w)||w.includes(x))) common++; }
  return common / Math.max(wa.length, wb.length);
}

function _fracToDecimal(frac){
  if(!frac) return null;
  try{
    if(frac.includes('/')){
      const [n,d] = frac.split('/');
      return Math.round((parseFloat(n)/parseFloat(d)+1)*100)/100;
    }
    return parseFloat(frac);
  }catch(e){ return null; }
}

async function _fetchAnalysis(m){
  const mid = m.match_id;
  if(_loaded[mid]) return _analysisStore[mid];

  const lk = m.league_key;
  let url = `/api/analyze/${m.home_id}/${m.away_id}`;
  const params = new URLSearchParams();
  if(lk) params.set('lk', lk);
  if(m.league_name) params.set('ln', m.league_name);
  params.set('mid', mid);
  if(m.home_team) params.set('hn', m.home_team);
  if(m.away_team) params.set('an', m.away_team);
  if(m.timestamp){
    const iso = new Date(m.timestamp*1000).toISOString().slice(0,10);
    params.set('dt', iso);
  }
  if(m.odd_home) params.set('oh', m.odd_home);
  if(m.odd_draw) params.set('od', m.odd_draw);
  if(m.odd_away) params.set('oa', m.odd_away);
  if(m.ou_lines_market && m.ou_lines_market.length)
    params.set('ou', JSON.stringify(m.ou_lines_market));
  if(m.iy_ou_lines_market && m.iy_ou_lines_market.length)
    params.set('iyou', JSON.stringify(m.iy_ou_lines_market));

  // SofaScore'dan oran çek (tarayıcıdan — sunucu engeli yok)
  try{
    const sofa = await _fetchSofaOdds(m);
    if(sofa){
      if(sofa.ms_home && !m.odd_home) params.set('oh', sofa.ms_home);
      if(sofa.ms_away && !m.odd_away) params.set('oa', sofa.ms_away);
      if(sofa.ou_line && !(m.ou_lines_market && m.ou_lines_market.length)){
        const ouLine = [{line: sofa.ou_line, odd_over: sofa.ou_over, odd_under: sofa.ou_under}];
        params.set('ou', JSON.stringify(ouLine));
      }
      if(sofa.iy_line && !(m.iy_ou_lines_market && m.iy_ou_lines_market.length)){
        const iyLine = [{line: sofa.iy_line, odd_over: sofa.iy_over, odd_under: sofa.iy_under}];
        params.set('iyou', JSON.stringify(iyLine));
      }
    }
  }catch(e){ console.warn('[Sofa fetch]', e.message); }

  url += '?' + params.toString();

  try{
    const r = await fetch(url);
    const d = await r.json();
    if(d.success){
      _analysisStore[mid] = d.analysis;
      _loaded[mid] = true;
      return d.analysis;
    }
  }catch(e){ console.error('[analyze]', mid, e); }
  return null;
}

// ─── Arka planda tüm maçları analiz et ───────────────────────
async function _backgroundAnalyzeAll(matches){
  // Eş zamanlı max 3 istek (sunucuyu boğma)
  const queue = [...matches];
  const CONCURRENCY = 3;

  async function worker(){
    while(queue.length > 0){
      const m = queue.shift();
      if(!m || _loaded[m.match_id]) continue;
      await _fetchAnalysis(m);
      // Kart açıksa paneli güncelle
      const card = document.getElementById(`card-${m.match_id}`);
      if(card && card.classList.contains('expanded')){
        const a = _analysisStore[m.match_id];
        if(a) renderAnalysis(m.match_id, a);
      }
      // Kart başlığındaki güven rozeti güncelle
      _updateCardBadge(m.match_id);
      // Filtre uygula
      if(_currentFilter !== 'all') _applyFilter();
    }
  }

  // 3 paralel worker başlat
  await Promise.all([worker(), worker(), worker()]);
  document.getElementById('status-bar').textContent =
    `${matches.length} maç · ${Object.keys(_analysisStore).length} analiz ✓`;
}

function _updateCardBadge(mid){
  const a = _analysisStore[mid];
  if(!a) return;
  const badge = document.getElementById(`badge-${mid}`);
  if(badge){
    const cls  = a.confidence >= 70 ? 'conf-high' : a.confidence >= 55 ? 'conf-mid' : 'conf-low';
    badge.className = `conf-badge ${cls}`;
    badge.textContent = a.confidence + '%';
  }
}

async function loadFixtures(){
  const date = document.getElementById('dateInput').value;
  document.getElementById('status-bar').textContent = 'Yükleniyor…';
  document.getElementById('matches-container').innerHTML = '';
  // Cache temizle (yeni gün)
  Object.keys(_matchStore).forEach(k => delete _matchStore[k]);
  Object.keys(_analysisStore).forEach(k => delete _analysisStore[k]);
  Object.keys(_loaded).forEach(k => delete _loaded[k]);

  try{
    const r = await fetch(`/api/fixtures?date=${date}`);
    const d = await r.json();
    if(!d.success || !d.matches.length){
      document.getElementById('matches-container').innerHTML =
        '<p style="text-align:center;color:#8b949e;padding:40px">Maç bulunamadı.</p>';
      document.getElementById('status-bar').textContent = '0 maç';
      return;
    }
    d.matches.forEach(m => _matchStore[m.match_id] = m);
    renderMatches(d.matches);
    document.getElementById('status-bar').textContent = `${d.matches.length} maç · analiz başlıyor…`;

    // Arka planda tüm analizleri başlat
    _backgroundAnalyzeAll(d.matches);

  }catch(e){
    document.getElementById('status-bar').textContent = 'Hata! (' + e.message + ')';
    console.error(e);
  }
}

function _applyFilter(){
  const searchVal = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
  const cards = document.querySelectorAll('.match-card');
  let visible = 0;
  cards.forEach(card => {
    const mid = card.id.replace('card-','');
    const m   = _matchStore[mid];
    const a   = _analysisStore[mid];
    let show  = true;

    // Arama filtresi
    if(searchVal){
      const translated = SEARCH_ALIASES[searchVal] || searchVal;
      const haystack = `${m?.league||''} ${m?.home_team||''} ${m?.away_team||''}`.toLowerCase();
      if(!haystack.includes(searchVal) && !haystack.includes(translated)) show = false;
    }

    // Buton filtresi
    if(show && _currentFilter === 'conf'){
      const conf = a ? a.confidence : 0;
      show = conf >= 70;
    } else if(show && _currentFilter === 'gap'){
      if(!a || !a.ou_lines || !a.ou_lines.length) { show = false; }
      else {
        const ouLine = a.ou_lines[0];
        const gap = (a.exp_total && ouLine.line) ? a.exp_total - ouLine.line : 0;
        show = gap >= 8;
      }
    } else if(show && _currentFilter === 'iy'){
      // IY tahmini güvenilir maçlar: güven ≥60 + IY tahmini var
      const conf = a ? a.confidence : 0;
      const hasIy = a && a.exp_iy_total && a.exp_iy_total > 0;
      show = conf >= 60 && hasIy;
    }

    card.style.display = show ? '' : 'none';
    if(show) visible++;
  });

  document.querySelectorAll('.time-group').forEach(grp => {
    const anyVisible = [...grp.querySelectorAll('.match-card')].some(c => c.style.display !== 'none');
    grp.style.display = anyVisible ? '' : 'none';
  });

  const filterLabel = _currentFilter === 'conf' ? '%70+ güven' 
    : _currentFilter === 'gap' ? 'GAP sinyali' 
    : _currentFilter === 'iy'  ? 'İY tahmini'
    : 'maç';
  document.getElementById('status-bar').textContent = `${visible} ${filterLabel}`;
}
function renderMatches(matches){
  const container = document.getElementById('matches-container');
  container.innerHTML = '';
  const groups = {};
  matches.forEach(m => {
    const t = m.time || '00:00';
    if(!groups[t]) groups[t] = [];
    groups[t].push(m);
  });
  Object.keys(groups).sort().forEach(time => {
    const grp  = groups[time];
    const gDiv = document.createElement('div');
    gDiv.className = 'time-group';
    const hdr = document.createElement('div');
    hdr.className = 'time-header';
    hdr.innerHTML = `<span>${time}</span><span class="cnt">${grp.length}</span>`;
    gDiv.appendChild(hdr);
    grp.forEach(m => gDiv.appendChild(buildCard(m)));
    container.appendChild(gDiv);
  });
}

// ─── Tıkla → hazır analizi göster ────────────────────────────
async function toggleCard(mid){
  const card  = document.getElementById(`card-${mid}`);
  const panel = document.getElementById(`panel-${mid}`);
  const isOpen = card.classList.contains('expanded');

  if(isOpen){ card.classList.remove('expanded'); panel.style.display='none'; return; }
  card.classList.add('expanded');
  panel.style.display = 'block';

  // Analiz hazırsa direkt göster
  if(_analysisStore[mid]){
    renderAnalysis(mid, _analysisStore[mid]);
    return;
  }

  // Henüz hazır değilse bekle (arka plan devam ediyor)
  panel.innerHTML = '<div class="analysis-loading">⏳ Analiz yükleniyor…</div>';
  const a = await _fetchAnalysis(_matchStore[mid]);
  if(a){
    renderAnalysis(mid, a);
    _updateCardBadge(mid);
  } else {
    panel.innerHTML = '<div class="analysis-loading">Veri bulunamadı.</div>';
  }
}

  };

  const res1Active = a.prediction==='1'?' active':'';
  const res2Active = a.prediction==='2'?' active':'';

  const resultGrid=`

      <div class="result-btn${res1Active}">
        <div class="r-lbl">1 (Ev)</div>
        ${hasMarket && a.market_odd_home

          <span style="font-size:.62rem;color:var(--blue)">Biz: ${pct(p_home)}</span>

        </div>

      <div class="result-btn${res2Active}">
        <div class="r-lbl">2 (Dep)</div>

          <span style="font-size:.62rem;color:var(--blue)">Biz: ${pct(p_away)}</span>
          ${a.mkt_impl_away?`<span style="font-size:.62rem;color:var(--yellow)">Mkt: ${pct(a.mkt_impl_away)}</span>`:''}
        </div>
        ${valBadge(vAway)}
      </div>
    </div>`;

  let implHtml='';
  if(a.mkt_impl_home && a.mkt_impl_away){
    implHtml=`<div class="impl-row">
      <div class="impl-item">
        <div class="il">Bizim (Ev)</div>
        <div class="iv our">${pct(p_home)}</div>
      </div>
      <div class="impl-item">
        <div class="il">Market (Ev)</div>
        <div class="iv mkt">${pct(a.mkt_impl_home)}</div>
      </div>
      <div class="impl-item">
        <div class="il">Market (Dep)</div>
        <div class="iv mkt">${pct(a.mkt_impl_away)}</div>

        <div class="il">Bizim (Dep)</div>

  let hcapHtml='';
  if(a.handicap_lines && a.handicap_lines.length){
    hcapHtml=`<div class="section-title">HANDİKAP (EV)</div><div class="hcap-section">`;
    a.handicap_lines.slice(1,5).forEach(l=>{

        <div class="hcap-row">
          <div class="hcap-line">${l.line>0?'+':''}${l.line}</div>
          <div class="hcap-bar">
            <div class="hcap-home" style="width:${l.p_home_cover}%">${l.p_home_cover}%</div>
            <div class="hcap-away" style="width:${l.p_away_cover}%">${l.p_away_cover}%</div>
          </div>
        </div>`;
    });
    hcapHtml+='</div>';
  }

  const rCls = v => v>0?'pos':v<0?'neg':'neu';
  const rg = a.g_rating||0; const ri = a.id_rating||0;
  const ratingHtml=`
    <div class="section-title">RATING</div>
    <div class="rating-row">
      <div class="rating-box"><div class="r-lbl">G</div>
        <div class="r-val ${rCls(rg)}">${rg>0?'+':''}${rg}</div></div>
      <div class="rating-box"><div class="r-lbl">İD</div>

  function buildOuSection(lines, title, mktLine=null, mktOver=null, mktUnder=null, expTotal=null){
    if(!lines||!lines.length) return '';

    // Mavi bar: model tahmini etrafında en anlamlı line
    // Eğer expTotal varsa ona en yakın line'ı seç, yoksa 50%'ye en uzağı
    let best;
    if(expTotal){
      best = lines.reduce((a,b)=>
        Math.abs(a.line - expTotal) <= Math.abs(b.line - expTotal) ? a : b);
    } else {
      best = lines.reduce((a,b)=>
        Math.abs(a.p_over-50) >= Math.abs(b.p_over-50) ? a : b);
    }

    let html = `<div class="section-title">${title}</div><div class="ou-section">`;

    // 🔵 Model satırı — exp_total değerini göster
    const displayLine = expTotal ? Math.round(expTotal*10)/10 : best.line;
    const gapStr = (mktLine != null && expTotal != null && Math.abs(mktLine - expTotal) >= 0.5)
      ? `<span style="font-size:.58rem;color:${mktLine>expTotal?'var(--red)':'var(--green)'};margin-left:6px">${mktLine>expTotal?'ALT↓':'ÜST↑'} ${Math.abs(mktLine-expTotal).toFixed(1)}</span>`
      : '';
    const signalBorder = best.value_bet
      ? `style="border:2px solid ${best.value_bet==='under'?'var(--red)':'var(--green)'}"`
      : '';

    html += `<div class="ou-row">
      <div class="ou-line" style="color:var(--blue);font-size:.65rem">🔵${best.line}</div>
      <div class="ou-bar" ${signalBorder}>
        <div class="ou-over"  style="width:${best.p_over}%">${best.p_over}%</div>
        <div class="ou-under" style="width:${best.p_under}%">${best.p_under}%</div>
      </div>
    </div>`;

    // 🟡 Piyasa satırı — sadece SofaScore'dan barem geldiyse göster
    if(mktLine != null){
      const ov = mktOver  ? mktOver.toFixed(2)  : '–';
      const un = mktUnder ? mktUnder.toFixed(2) : '–';
      const gapIndicator = (expTotal != null && Math.abs(mktLine - expTotal) >= 0.5)
        ? `<span style="font-size:.58rem;color:${mktLine>expTotal?'var(--red)':'var(--green)'};margin-left:6px">${mktLine>expTotal?'ALT↓':'ÜST↑'} ${Math.abs(mktLine-expTotal).toFixed(1)}</span>`
        : '';
      html += `<div class="ou-row" style="margin-top:3px">
        <div class="ou-line" style="color:var(--yellow);font-size:.65rem">🟡${mktLine}${gapIndicator}</div>
        <div style="flex:1;height:20px;border-radius:4px;background:var(--card2);border:1px solid #e3b34144;display:flex;align-items:center;padding:0 10px;gap:10px">
          <span style="font-size:.65rem;color:var(--yellow);font-weight:700">📊 Piyasa</span>
          <span style="font-size:.65rem;color:var(--green)">Ü: ${ov}</span>
          <span style="font-size:.65rem;color:var(--red)">A: ${un}</span>
        </div>
      </div>`;
    }

    html += '</div>';
    return html;
  }

  // ── ESKI KOD KALINTISI SILINDI ──

  const ouHtml   = buildOuSection(a.ou_lines,    'ALT / ÜST',
    ouSource ? ouSource.ou_line  : null,
    ouSource ? ouSource.ou_over  : null,
    ouSource ? ouSource.ou_under : null,
    a.exp_total);
  const iyOuHtml = buildOuSection(a.iy_ou_lines, 'İY ALT / ÜST',
    iySource ? iySource.iy_line  : null,
    iySource ? iySource.iy_over  : null,
    iySource ? iySource.iy_under : null,
    a.exp_iy_total);

  // Ev/Dep takım OU (Bet365'ten)
  let teamOuHtml = '';
  if(b365 && (b365.home_ou_line || b365.away_ou_line)){
    teamOuHtml = `<div class="section-title">TAKIM BAREMLERİ (Bet365)</div><div class="ou-section">`;
    if(b365.home_ou_line){
      const ov = b365.home_ou_over  ? b365.home_ou_over.toFixed(2)  : '–';
      const un = b365.home_ou_under ? b365.home_ou_under.toFixed(2) : '–';
      teamOuHtml += `<div class="ou-row">
        <div class="ou-line" style="color:var(--blue);font-size:.65rem">🏠${b365.home_ou_line}</div>
        <div style="flex:1;height:20px;border-radius:4px;background:var(--card2);border:1px solid #58a6ff44;display:flex;align-items:center;padding:0 10px;gap:10px">
          <span style="font-size:.65rem;color:var(--blue);font-weight:700">Ev</span>
          <span style="font-size:.65rem;color:var(--green)">Ü: ${ov}</span>
          <span style="font-size:.65rem;color:var(--red)">A: ${un}</span>
        </div>
      </div>`;
    }
    if(b365.away_ou_line){
      const ov = b365.away_ou_over  ? b365.away_ou_over.toFixed(2)  : '–';
      const un = b365.away_ou_under ? b365.away_ou_under.toFixed(2) : '–';
      teamOuHtml += `<div class="ou-row" style="margin-top:3px">
        <div class="ou-line" style="color:var(--purple);font-size:.65rem">✈️${b365.away_ou_line}</div>
        <div style="flex:1;height:20px;border-radius:4px;background:var(--card2);border:1px solid #d2a8ff44;display:flex;align-items:center;padding:0 10px;gap:10px">
          <span style="font-size:.65rem;color:var(--purple);font-weight:700">Dep</span>
          <span style="font-size:.65rem;color:var(--green)">Ü: ${ov}</span>
          <span style="font-size:.65rem;color:var(--red)">A: ${un}</span>
        </div>
      </div>`;
    }
    teamOuHtml += '</div>';
  }

  let dataInfoHtml='';
  if(a.data_info){
    const di=a.data_info;
    dataInfoHtml=`<div class="data-info">
      Ev: ${di.home_general_count} genel / ${di.home_venue_count} iç &nbsp;|&nbsp;
      Dep: ${di.away_general_count} genel / ${di.away_venue_count} dış &nbsp;|&nbsp;
      Güven: ${a.confidence}%
    </div>`;
  }

  panel.innerHTML = sysPredHtml + valueAlertHtml + statRow + resultGrid + implHtml + hcapHtml + ratingHtml + ouHtml + iyOuHtml + teamOuHtml + dataInfoHtml;
}

// ── UTC+1 bugün (timezone-safe) ───────────────────────────────────
function todayUTC3(){
  // UTC+3 Türkiye saati
  const utcMs = Date.now() + 3 * 3600 * 1000;
  const d = new Date(utcMs);
  const yyyy = d.getUTCFullYear();
  const mm   = String(d.getUTCMonth()+1).padStart(2,'0');
  const dd   = String(d.getUTCDate()).padStart(2,'0');
  return `${yyyy}-${mm}-${dd}`;
}

function isoAddDays(iso, n){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  dt.setUTCDate(dt.getUTCDate() + n);
  return dt.toISOString().slice(0,10);
}

function isoToUTC3Date(iso){
  // parse iso as UTC midnight, return JS Date in UTC+1 for display
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(Date.UTC(y, m-1, d));
}

// ── Tarih Sekmeleri ───────────────────────────────────────────────
const TR_DAYS   = ['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const TR_MONTHS = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];

let _currentTodayIso = todayUTC3();

function buildDateTabs(){
  const todayIso = todayUTC3();
  _currentTodayIso = todayIso;
  const container = document.getElementById('dateTabs');
  container.innerHTML = '';

  for(let i = -3; i <= 4; i++){
    const iso = isoAddDays(todayIso, i);
    const dt  = isoToUTC3Date(iso);
    const isToday = iso === todayIso;

    const dayName   = TR_DAYS[dt.getUTCDay()];
    const dateLabel = isToday ? 'Bugün' : `${dt.getUTCDate()} ${TR_MONTHS[dt.getUTCMonth()]}`;
    const subLabel  = isToday ? iso.slice(5).replace('-','/') : dayName;

    const btn = document.createElement('button');
    btn.className = 'date-tab' + (isToday ? ' is-today' : '');
    btn.dataset.date = iso;
    btn.innerHTML = `
      <span class="dt-date">${dateLabel}</span>
      <span class="dt-day">${subLabel}</span>
      ${isToday ? '<div class="today-pip"></div>' : ''}
    `;
    btn.onclick = () => selectDate(iso);
    container.appendChild(btn);
  }

  // Aktif sekmeyi seç (bugün)
  selectDate(todayIso, /*noLoad=*/true);
  document.getElementById('dateInput').value = todayIso;
}

function selectDate(iso, noLoad){
  document.getElementById('dateInput').value = iso;
  document.querySelectorAll('.date-tab').forEach(b=>{
    b.classList.toggle('active', b.dataset.date === iso);
  });
  // aktif sekmeye scroll
  const active = document.querySelector('.date-tab.active');
  if(active) active.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  if(!noLoad) loadFixtures();
}

// ── Gece yarısı UTC+1'te sekmeleri yenile ────────────────────────
function scheduleMidnightRefresh(){
  // UTC+1 gece yarısına kaç ms kaldı?
  const now      = Date.now() + 1 * 3600 * 1000;   // şu an UTC+1 ms
  const msInDay  = now % 86400000;
  const msToMidnight = 86400000 - msInDay + 500;    // +500ms güvenlik payı

  setTimeout(() => {
    document.getElementById('btn-all').classList.add('active');
  document.getElementById('btn-iy') && document.getElementById('btn-iy').addEventListener('click', () => {});
  buildDateTabs();   // sekmeleri yeniden oluştur (yeni "bugün")
    loadFixtures();    // yeni günün maçlarını yükle
    scheduleMidnightRefresh(); // sonraki gece için tekrar planla
  }, msToMidnight);
}

buildDateTabs();
loadFixtures();
scheduleMidnightRefresh();
</script>
