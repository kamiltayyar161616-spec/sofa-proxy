<script>
function buildMatchCard(a) {
    const sp = a.system_prediction;
    
    // Sistem Öngörü Paneli (En Üste Eklenir)
    let systemHtml = `
    <div style="background:var(--card2); border:1px solid var(--orange); padding:10px; border-radius:8px; margin-bottom:12px;">
        <div style="color:var(--orange); font-size:0.7rem; font-weight:800; margin-bottom:8px; text-transform:uppercase; display:flex; justify-content:space-between;">
            <span>Sistem İstatistik Öngörüsü (Son 6 Maç)</span>
            <span style="color:var(--muted)">API Dışı</span>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; font-size:0.8rem;">
            <div><span style="color:var(--muted)">Tahmin MS:</span> <b style="color:var(--text)">${sp.exp_ms}</b></div>
            <div><span style="color:var(--muted)">MS Toplam:</span> <b style="color:var(--yellow)">${sp.exp_ms_total}</b></div>
            <div><span style="color:var(--muted)">Tahmin İY:</span> <b style="color:var(--text)">${sp.exp_iy}</b></div>
            <div><span style="color:var(--muted)">Sistem Handikap:</span> <b style="color:var(--purple)">${sp.exp_hcap}</b></div>
        </div>
    </div>
    `;

    // Mevcut kart içeriğiyle birleştirme
    let html = `<div class="match-card">
        ${systemHtml}
        <div class="match-header">
            <div class="match-title">${a.match}</div>
        </div>
        `;
    return html;
}
</script>
