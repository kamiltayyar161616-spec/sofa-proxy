<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BasketOracle — Value Hunting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07071a;--bg1:#0d0d24;--bg2:#11112e;--bg3:#161638;
  --border:rgba(255,140,0,0.12);--borderacc:rgba(255,140,0,0.4);
  --c1:#f97316;--c2:#fb923c;
  --grad:linear-gradient(135deg,#f97316,#ef4444);
  --grad2:linear-gradient(135deg,#fb923c,#fbbf24);
  --text:#e8e8f8;--muted:#4a4a5a;--dim:#7878aa;
  --green:#22c55e;--red:#f87171;--blue:#60a5fa;
  --glow:0 0 24px rgba(249,115,22,0.15);--radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 20% 10%,rgba(249,115,22,.06) 0%,transparent 60%),radial-gradient(ellipse 50% 35% at 80% 80%,rgba(239,68,68,.05) 0%,transparent 55%);pointer-events:none;z-index:0;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:var(--bg1);}::-webkit-scrollbar-thumb{background:rgba(249,115,22,.4);border-radius:3px;}
header{position:sticky;top:0;z-index:200;background:rgba(7,7,26,.92);backdrop-filter:blur(22px);border-bottom:1px solid var(--border);}
.h-inner{max-width:900px;margin:0 auto;padding:0 16px;height:52px;display:flex;align-items:center;gap:12px;}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;}
.logo-gem{width:28px;height:28px;border-radius:7px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 0 14px rgba(249,115,22,.5);}
.logo-name{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;background:var(--grad2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.logo-sub{font-size:8px;font-weight:700;color:var(--c2);background:rgba(249,115,22,.12);border:1px solid rgba(249,115,22,.25);padding:2px 6px;border-radius:20px;text-transform:uppercase;}
.h-spacer{flex:1;}
.h-stats{display:flex;gap:14px;align-items:center;}
.h-stat-v{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:var(--c2);}
.h-stat-l{font-size:9px;color:var(--muted);text-transform:uppercase;}
.date-nav{display:flex;gap:5px;overflow-x:auto;padding:8px 16px;scrollbar-width:none;max-width:900px;margin:0 auto;}
.date-nav::-webkit-scrollbar{display:none;}
.date-btn{background:var(--bg1);border:1px solid var(--border);color:var(--dim);padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;}
.date-btn.active{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 2px 12px rgba(249,115,22,.4);}
main{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:10px 16px 60px;}
.stat-banner{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
.s-card{background:var(--bg1);border:1px solid var(--border);border-radius:8px;padding:10px 12px;position:relative;overflow:hidden;}
.s-card::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:var(--grad);opacity:.5;}
.s-icon{font-size:14px;margin-bottom:3px;}
.s-val{font-family:'Bebas Neue',sans-serif;font-size:20px;background:var(--grad2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:1px;}
.s-label{font-size:9px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px;}
.filter-bar{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
.f-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-right:2px;}
.chip{background:var(--bg1);border:1px solid var(--border);color:var(--dim);padding:4px 10px;border-radius:20px;font-size:10px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;}
.chip.on{border-color:var(--c1);color:var(--c2);background:rgba(249,115,22,.08);}
.chip.high.on{background:rgba(34,197,94,.1);border-color:var(--green);color:var(--green);}
.search-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.search-input{flex:1;background:var(--bg1);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:20px;font-size:12px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .15s;}
.search-input::placeholder{color:var(--muted);}
.search-input:focus{border-color:var(--c1);}
.search-clear{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:4px;display:none;}
.search-clear.show{display:block;}
.time-group{margin-bottom:14px;}
.time-header{display:flex;align-items:center;gap:8px;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border);}
.time-label{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--c2);}
.time-cnt{font-size:9px;font-weight:700;background:rgba(249,115,22,.12);border:1px solid rgba(249,115,22,.25);color:var(--c2);padding:1px 6px;border-radius:20px;}
.match-card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:5px;overflow:hidden;transition:border-color .2s;cursor:pointer;}
.match-card:hover{border-color:var(--borderacc);box-shadow:var(--glow);}
.match-card.hot .mc-topbar{background:var(--grad);}
.match-card.high70 .mc-topbar{background:linear-gradient(135deg,#22c55e,#16a34a);}
.match-card.live-card{border-color:rgba(239,68,68,.3);}
.match-card.live-card .mc-topbar{background:linear-gradient(135deg,#ef4444,#dc2626);animation:pulse-bar 1.5s infinite;}
.match-card.finished-card{opacity:.7;}
.match-card.finished-card .mc-topbar{background:rgba(255,255,255,.07);}
@keyframes pulse-bar{0%,100%{opacity:1;}50%{opacity:.3;}}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.match-card{animation:fadeUp .25s ease both;}
.mc-topbar{height:2px;background:transparent;}
.mc-row{display:flex;align-items:center;padding:8px 12px;gap:8px;}
.mc-time-col{display:flex;flex-direction:column;align-items:center;min-width:40px;flex-shrink:0;}
.mc-time{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--c2);font-weight:600;}
.mc-status-badge{font-size:8px;font-weight:700;padding:1px 5px;border-radius:10px;margin-top:2px;white-space:nowrap;}
.live-b{background:rgba(239,68,68,.2);color:#ef4444;animation:blink 1s infinite;}
.ft-b{background:rgba(255,255,255,.07);color:var(--muted);}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.4;}}
.mc-teams-col{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;}
.mc-league-name{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.team-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.team-name.away{color:var(--dim);}
.mc-score-col{display:flex;flex-direction:column;align-items:center;min-width:56px;flex-shrink:0;}
.score-main{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;line-height:1;}
.score-main.live{color:#ef4444;}
.score-main.ft{color:var(--dim);}
.score-vs{font-size:11px;color:var(--muted);font-weight:600;}
.score-ht{font-size:9px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-top:1px;}
.mc-analysis-col{display:flex;flex-direction:column;align-items:flex-end;min-width:80px;flex-shrink:0;gap:3px;}
.pred-badge{display:flex;align-items:center;gap:3px;}
.pred-pick{font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--c2);}
.pred-pct{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text);font-weight:600;}
.ou-badge{font-size:9px;color:var(--blue);font-weight:600;}
.conf-mini{display:flex;align-items:center;gap:4px;width:100%;}
.conf-mini-track{flex:1;height:3px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden;}
.conf-mini-fill{height:100%;border-radius:2px;background:var(--grad);}
.conf-mini-val{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);}
.analyzing-mini{font-size:9px;color:var(--muted);display:flex;align-items:center;gap:3px;}
.spin-mini{width:10px;height:10px;border:1.5px solid rgba(249,115,22,.2);border-top-color:var(--c1);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}
.hot-b{background:var(--grad);color:#fff;font-size:8px;font-weight:700;padding:1px 5px;border-radius:10px;}
.high-b{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;font-size:8px;font-weight:700;padding:1px 5px;border-radius:10px;}
/* Detail */
.mc-detail{background:var(--bg2);border-top:1px solid var(--border);padding:10px 12px;display:none;}
.match-card.expanded .mc-detail{display:block;}
.detail-row{display:flex;gap:8px;margin-bottom:8px;}
.detail-block{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 10px;}
.detail-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:7px;display:flex;align-items:center;gap:4px;}
.detail-title::before{content:'';width:4px;height:4px;border-radius:50%;background:var(--c1);display:inline-block;}
.odds-row{display:flex;gap:4px;}
.odd-item{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:5px 3px;text-align:center;position:relative;overflow:hidden;}
.odd-item.pick{border-color:var(--c1);background:rgba(249,115,22,.1);}
.odd-item.pick::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--grad);}
.odd-lbl{font-size:9px;font-weight:700;color:var(--muted);margin-bottom:1px;}
.odd-val{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:var(--text);}
.odd-item.pick .odd-val{color:var(--c2);}
.odd-pct{font-size:9px;color:var(--muted);}
.ou-section{margin-top:8px;}
.ou-title{font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:5px;}
.ou-lines-grid{display:flex;flex-direction:column;gap:3px;}
.ou-line-row{display:flex;align-items:center;gap:6px;}
.ou-line-label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);min-width:48px;}
.ou-bar-wrap{flex:1;display:flex;gap:2px;height:14px;}
.ou-bar-over{background:rgba(34,197,94,.3);border-radius:3px 0 0 3px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:var(--green);}
.ou-bar-under{background:rgba(248,113,113,.3);border-radius:0 3px 3px 0;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:var(--red);}
.hcap-section{margin-top:8px;}
.rating-row{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:7px;border-top:1px solid var(--border);}
.rating-label{font-size:9px;font-weight:700;text-transform:uppercase;color:var(--muted);}
.rating-badge{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;}
.rating-badge.pos{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.25);color:#22c55e;}
.rating-badge.neg{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.25);color:#f87171;}
.rating-badge.zero{background:rgba(120,120,170,.12);border:1px solid rgba(120,120,170,.2);color:var(--dim);}
.exp-scores{display:flex;gap:6px;margin-top:6px;}
.exp-score-item{flex:1;text-align:center;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:4px;}
.exp-score-val{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--c2);}
.exp-score-lbl{font-size:8px;color:var(--muted);}
/* States */
.state-box{text-align:center;padding:60px 20px;display:none;}
.state-box.show{display:block;}
.state-icon{font-size:40px;opacity:.3;margin-bottom:10px;}
.state-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;color:var(--muted);margin-bottom:6px;}
.global-loading{display:none;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:12px;}
.global-loading.show{display:flex;}
.big-spin{width:36px;height:36px;border:3px solid rgba(249,115,22,.15);border-top-color:var(--c1);border-radius:50%;animation:spin .8s linear infinite;}
.big-spin-lbl{font-size:12px;color:var(--muted);}
@media(max-width:600px){.stat-banner{grid-template-columns:repeat(2,1fr);}.h-stats{display:none;}}
</style>
</head>
<body>
<header>
  <div class="h-inner">
    <a class="logo" href="/">
      <div class="logo-gem">🏀</div>
      <div class="logo-name">BasketOracle</div>
      <div class="logo-sub">Value Hunting</div>
    </a>
    <div class="h-spacer"></div>
    <div class="h-stats">
      <div><div class="h-stat-v" id="hv-total">—</div><div class="h-stat-l">Maç</div></div>
      <div><div class="h-stat-v" id="hv-hot">—</div><div class="h-stat-l">Güçlü</div></div>
      <div><div class="h-stat-v" id="hv-conf">—</div><div class="h-stat-l">Güven</div></div>
    </div>
  </div>
</header>
<div class="date-nav" id="dateNav"></div>
<main>
  <div class="stat-banner">
    <div class="s-card"><div class="s-icon">🎯</div><div class="s-val" id="sb-total">0</div><div class="s-label">Analiz</div></div>
    <div class="s-card"><div class="s-icon">🔥</div><div class="s-val" id="sb-hot">0</div><div class="s-label">Güçlü</div></div>
    <div class="s-card"><div class="s-icon">📊</div><div class="s-val" id="sb-ou">—</div><div class="s-label">Ort. Toplam</div></div>
    <div class="s-card"><div class="s-icon">⚡</div><div class="s-val" id="sb-conf">—%</div><div class="s-label">Ort. Güven</div></div>
  </div>
  <div class="filter-bar">
    <span class="f-label">FİLTRE</span>
    <button class="chip on"   onclick="setFilter('all',this)">Tümü</button>
    <button class="chip high" onclick="setFilter('high70',this)">⭐ %70+</button>
    <button class="chip high" onclick="setFilter('high85',this)">✅ %85+</button>
    <button class="chip"      onclick="setFilter('hot',this)">🔥 Güçlü</button>
    <button class="chip"      onclick="setFilter('live',this)">🔴 Canlı</button>
    <button class="chip"      onclick="setFilter('1',this)">🏠 Ev</button>
    <button class="chip"      onclick="setFilter('2',this)">✈️ Dep.</button>
    <button class="chip"      onclick="setFilter('over',this)">📈 Üst</button>
    <button class="chip"      onclick="setFilter('under',this)">📉 Alt</button>
  </div>
  <div class="search-bar">
    <input class="search-input" id="searchInput" type="text" placeholder="🔍 Takım veya lig ara..." oninput="onSearch(this.value)">
    <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
  </div>
  <div id="globalLoading" class="global-loading show"><div class="big-spin"></div><div class="big-spin-lbl">Yükleniyor...</div></div>
  <div id="emptyState" class="state-box"><div class="state-icon">🏀</div><div class="state-title">Maç Bekleniyor</div><div class="state-desc">Tarih seç.</div></div>
  <div id="errorState" class="state-box"><div class="state-icon">⚠️</div><div class="state-title">Hata</div><div class="state-desc">Tekrar dene.</div></div>
  <div id="matchesContainer"></div>
</main>

<script>
let allMatches = [];
let filter = 'all';
let searchQuery = '';
let currentDate = todayStr();

function todayStr() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
}
function addDays(d, n) {
  const dt = new Date(d + 'T00:00:00');
  dt.setDate(dt.getDate() + n);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}
function formatDateLabel(d) {
  if (d === todayStr()) return 'Bugün';
  const dt = new Date(d + 'T00:00:00');
  const days   = ['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
  const months = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
  return `${dt.getDate()} ${months[dt.getMonth()]} ${days[dt.getDay()]}`;
}
function buildDateNav() {
  const nav = document.getElementById('dateNav');
  const dates = [];
  for (let i = -2; i <= 4; i++) dates.push(addDays(todayStr(), i));
  nav.innerHTML = dates.map(d =>
    `<button class="date-btn ${d === currentDate ? 'active' : ''}" onclick="selectDate('${d}')">${formatDateLabel(d)}</button>`
  ).join('');
}
function selectDate(d) { currentDate = d; buildDateNav(); loadFixtures(); }
document.addEventListener('DOMContentLoaded', () => { buildDateNav(); loadFixtures(); });

async function loadFixtures() {
  showState('loading');
  try {
    const res  = await fetch(`/api/fixtures?date=${currentDate}`);
    const data = await res.json();
    if (!data.success || !data.matches.length) { showState('empty'); return; }
    allMatches = data.matches.map(m => ({ ...m, analysis: null, loading: true }));
    showState('matches');
    renderAll();
    const promises = allMatches.map((m, i) => {
      const lk = m.league_key ? `?lk=${m.league_key}` : '';
      return fetch(`/api/analyze/${m.home_id}/${m.away_id}${lk}`)
        .then(r => r.json())
        .then(d => {
          allMatches[i].analysis = d.analysis || null;
          allMatches[i].loading  = false;
          updateCard(i);
          updateStats();
        })
        .catch(() => { allMatches[i].loading = false; updateCard(i); });
    });
    await Promise.allSettled(promises);
    updateStats();
  } catch(e) { console.error(e); showState('error'); }
}

function isHot(a) {
  if (!a) return false;
  const spread = Math.abs(a.spread || 0);
  if (a.prediction === '1' && a.prob_home >= 65) return true;
  if (a.prediction === '2' && a.prob_away >= 65) return true;
  if (spread >= 10) return true;
  return false;
}

function filteredMatches() {
  return allMatches.filter((m, i) => {
    m._idx = i;
    if (searchQuery) {
      const s = searchQuery;
      if (!m.home_team.toLowerCase().includes(s) &&
          !m.away_team.toLowerCase().includes(s) &&
          !m.league.toLowerCase().includes(s)) return false;
    }
    if (filter === 'all')    return true;
    if (filter === 'live')   return m.status === 'live';
    if (!m.analysis)         return false;
    if (filter === 'high70') return m.analysis.confidence >= 70;
    if (filter === 'high85') return m.analysis.confidence >= 85;
    if (filter === 'hot')    return isHot(m.analysis);
    if (filter === 'over')   return m.analysis.ou_over_pct >= 60;
    if (filter === 'under')  return m.analysis.ou_under_pct >= 60;
    return m.analysis.prediction === filter;
  });
}

function renderAll() {
  const c  = document.getElementById('matchesContainer');
  const ms = filteredMatches();
  if (!ms.length) { c.innerHTML = ''; return; }
  const groups = {};
  ms.forEach(m => {
    const t = m.time || '00:00';
    if (!groups[t]) groups[t] = [];
    groups[t].push(m);
  });
  let html = '';
  for (const time of Object.keys(groups).sort()) {
    const list = groups[time];
    html += `<div class="time-group"><div class="time-header"><span class="time-label">${time}</span><span class="time-cnt">${list.length}</span></div>${list.map(m => cardHtml(m)).join('')}</div>`;
  }
  c.innerHTML = html;
}

function updateCard(idx) {
  const el = document.getElementById(`card-${idx}`);
  if (!el) return;
  const wasExp = el.classList.contains('expanded');
  const tmp = document.createElement('div');
  tmp.innerHTML = cardHtml(allMatches[idx]);
  const card = tmp.firstElementChild;
  if (wasExp) card.classList.add('expanded');
  el.replaceWith(card);
}

function toggleCard(idx) {
  const el = document.getElementById(`card-${idx}`);
  if (el) el.classList.toggle('expanded');
}

function ratingBadge(label, value) {
  if (value === null || value === undefined) return '';
  const cls  = value > 0 ? 'pos' : value < 0 ? 'neg' : 'zero';
  const sign = value > 0 ? '+' : '';
  return `<span class="rating-badge ${cls}">${label} ${sign}${value}</span>`;
}

function cardHtml(m) {
  const idx    = m._idx !== undefined ? m._idx : allMatches.indexOf(m);
  const a      = m.analysis;
  const hot    = a && isHot(a);
  const h70    = a && a.confidence >= 70;
  const isLive = m.status === 'live';
  const isDone = m.status === 'finished';

  let cardClass = '';
  if (isLive)     cardClass = 'live-card';
  else if (isDone) cardClass = 'finished-card';
  else if (h70)   cardClass = 'high70';
  else if (hot)   cardClass = 'hot';

  let statusBadge = '';
  if (isLive)      statusBadge = `<span class="mc-status-badge live-b">🔴 ${m.live_min || 'CANLI'}</span>`;
  else if (isDone) statusBadge = `<span class="mc-status-badge ft-b">FT</span>`;

  let midCol = '';
  if (isLive || isDone) {
    const hs  = m.home_score != null ? m.home_score : '?';
    const as_ = m.away_score != null ? m.away_score : '?';
    const ht  = (m.home_ht_score != null && m.away_ht_score != null) ?
      `<div class="score-ht">(${m.home_ht_score}-${m.away_ht_score})</div>` : '';
    midCol = `<div class="mc-score-col"><div class="score-main ${isLive?'live':'ft'}">${hs}-${as_}</div>${ht}</div>`;
  } else {
    midCol = `<div class="mc-score-col"><span class="score-vs">VS</span></div>`;
  }

  let analysisCol = '';
  if (m.loading || !a) {
    analysisCol = `<div class="mc-analysis-col"><div class="analyzing-mini"><div class="spin-mini"></div><span>...</span></div></div>`;
  } else {
    const eb   = h70 ? `<span class="high-b">%70+</span>` : hot ? `<span class="hot-b">🔥</span>` : '';
    const pct  = a.prediction === '1' ? a.prob_home : a.prob_away;
    const ouTxt = a.ou_over_pct >= 55 ? `📈 ${a.ou_line} Üst %${a.ou_over_pct}` :
                  a.ou_under_pct >= 55 ? `📉 ${a.ou_line} Alt %${a.ou_under_pct}` : '';
    analysisCol = `<div class="mc-analysis-col">
      <div class="pred-badge">${eb}<span class="pred-pick">${a.prediction}</span><span class="pred-pct">${pct}%</span></div>
      ${ouTxt ? `<div class="ou-badge">${ouTxt}</div>` : ''}
      <div class="conf-mini"><div class="conf-mini-track"><div class="conf-mini-fill" style="width:${a.confidence}%"></div></div><span class="conf-mini-val">${a.confidence}%</span></div>
    </div>`;
  }

  let detailBlock = '';
  if (a) {
    const pc = k => a.prediction === k ? 'pick' : '';
    const gVal  = a.g_rating  !== undefined ? a.g_rating  : null;
    const idVal = a.id_rating !== undefined ? a.id_rating : null;

    // Alt/Üst çizgileri (en yakın 3)
    const ouLines = (a.ou_lines || []).slice(0, 6).map(l =>
      `<div class="ou-line-row">
        <span class="ou-line-label">${l.line}</span>
        <div class="ou-bar-wrap">
          <div class="ou-bar-over" style="flex:${l.p_over}">${l.p_over}%</div>
          <div class="ou-bar-under" style="flex:${l.p_under}">${l.p_under}%</div>
        </div>
      </div>`
    ).join('');

    const iyOuLines = (a.iy_ou_lines || []).slice(0, 4).map(l =>
      `<div class="ou-line-row">
        <span class="ou-line-label">${l.line}</span>
        <div class="ou-bar-wrap">
          <div class="ou-bar-over" style="flex:${l.p_over}">${l.p_over}%</div>
          <div class="ou-bar-under" style="flex:${l.p_under}">${l.p_under}%</div>
        </div>
      </div>`
    ).join('');

    // Handikap çizgileri
    const hcapLines = (a.handicap_lines || []).filter(l => Math.abs(l.p_home_cover - 50) > 5).slice(0, 4).map(l =>
      `<div class="ou-line-row">
        <span class="ou-line-label">${l.line > 0 ? '+' : ''}${l.line}</span>
        <div class="ou-bar-wrap">
          <div class="ou-bar-over" style="flex:${l.p_home_cover}">${l.p_home_cover}%</div>
          <div class="ou-bar-under" style="flex:${l.p_away_cover}">${l.p_away_cover}%</div>
        </div>
      </div>`
    ).join('');

    detailBlock = `
    <div class="mc-detail">
      <div class="exp-scores">
        <div class="exp-score-item"><div class="exp-score-val">${a.exp_home}</div><div class="exp-score-lbl">Ev MS</div></div>
        <div class="exp-score-item"><div class="exp-score-val">${a.exp_total}</div><div class="exp-score-lbl">MS Toplam</div></div>
        <div class="exp-score-item"><div class="exp-score-val">${a.exp_away}</div><div class="exp-score-lbl">Dep MS</div></div>
      </div>
      <div class="exp-scores" style="margin-top:4px">
        <div class="exp-score-item" style="border-color:rgba(96,165,250,0.3)"><div class="exp-score-val" style="font-size:14px;color:var(--blue)">${a.exp_iy_home}</div><div class="exp-score-lbl">Ev İY</div></div>
        <div class="exp-score-item" style="border-color:rgba(96,165,250,0.3)"><div class="exp-score-val" style="font-size:14px;color:var(--blue)">${a.exp_iy_total}</div><div class="exp-score-lbl">İY Toplam</div></div>
        <div class="exp-score-item" style="border-color:rgba(96,165,250,0.3)"><div class="exp-score-val" style="font-size:14px;color:var(--blue)">${a.exp_iy_away}</div><div class="exp-score-lbl">Dep İY</div></div>
      </div>
      <div class="detail-row" style="margin-top:8px">
        <div class="detail-block">
          <div class="detail-title">MAÇ SONUCU</div>
          <div class="odds-row">
            <div class="odd-item ${pc('1')}"><div class="odd-lbl">1</div><div class="odd-val">${a.odd_home}</div><div class="odd-pct">${a.prob_home}%</div></div>
            <div class="odd-item ${pc('2')}"><div class="odd-lbl">2</div><div class="odd-val">${a.odd_away}</div><div class="odd-pct">${a.prob_away}%</div></div>
          </div>
          <div class="ou-section">
            <div class="ou-title">HANDİKAP (Ev)</div>
            <div class="ou-lines-grid">${hcapLines}</div>
          </div>
          ${(gVal !== null || idVal !== null) ? `
          <div class="rating-row">
            <span class="rating-label">Rating</span>
            ${ratingBadge('G', gVal)}
            ${ratingBadge('İD', idVal)}
          </div>` : ''}
        </div>
        <div class="detail-block">
          <div class="detail-title">ALT / ÜST</div>
          <div class="ou-lines-grid">${ouLines}</div>
          <div class="ou-section">
            <div class="ou-title">İY ALT / ÜST</div>
            <div class="ou-lines-grid">${iyOuLines}</div>
          </div>
        </div>
      </div>
    </div>`;
  }

  return `
  <div class="match-card ${cardClass}" id="card-${idx}" onclick="toggleCard(${idx})">
    <div class="mc-topbar"></div>
    <div class="mc-row">
      <div class="mc-time-col"><span class="mc-time">${m.time||''}</span>${statusBadge}</div>
      <div class="mc-teams-col">
        <div class="mc-league-name">${escHtml(m.league||'')}</div>
        <div class="team-name">${escHtml(m.home_team)}</div>
        <div class="team-name away">${escHtml(m.away_team)}</div>
      </div>
      ${midCol}
      ${analysisCol}
    </div>
    ${detailBlock}
  </div>`;
}

function updateStats() {
  const an   = allMatches.filter(m => m.analysis);
  const hot  = an.filter(m => isHot(m.analysis)).length;
  const conf = an.length ? Math.round(an.reduce((s,m) => s+(m.analysis.confidence||0),0)/an.length) : 0;
  const avgOu = an.length ? Math.round(an.reduce((s,m) => s+(m.analysis.exp_total||0),0)/an.length) : 0;
  document.getElementById('hv-total').textContent = allMatches.length;
  document.getElementById('hv-hot').textContent   = hot;
  document.getElementById('hv-conf').textContent  = an.length ? `${conf}%` : '—';
  document.getElementById('sb-total').textContent = an.length;
  document.getElementById('sb-hot').textContent   = hot;
  document.getElementById('sb-ou').textContent    = avgOu || '—';
  document.getElementById('sb-conf').textContent  = an.length ? `${conf}%` : '—%';
}

function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  btn.classList.add('on');
  renderAll();
}

function onSearch(val) {
  searchQuery = val.toLowerCase().trim();
  document.getElementById('searchClear').classList.toggle('show', searchQuery.length > 0);
  renderAll();
}
function clearSearch() {
  searchQuery = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClear').classList.remove('show');
  renderAll();
}

function showState(s) {
  document.getElementById('globalLoading').classList.toggle('show', s==='loading');
  document.getElementById('emptyState').classList.toggle('show', s==='empty');
  document.getElementById('errorState').classList.toggle('show', s==='error');
  if (s !== 'matches') document.getElementById('matchesContainer').innerHTML = '';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
